{% extends "base.html" %}

{% block title %}{{ code }} - {{ preferences.site_title if preferences else 'DC Gaming' }}{% endblock %}

{% block content %}
<main id="main" class="profile">
    <h1 class="profile-name error-code">{{ code }}</h1>
    <p class="profile-bio">{{ message }}</p>
    <a href="{{ url_for('index') }}" class="back-btn">
        <i class="fas fa-arrow-left" aria-hidden="true"></i> Back to Home
    </a>
</main>
{% endblock %}
