<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="{{ preferences.background_color if preferences else '#15110C' }}">
    <meta name="description" content="{% block description %}{{ preferences.site_description if preferences else 'Donkey Kong Country speedrunning and other shenanigans' }}{% endblock %}">

    <title>{% block title %}{{ preferences.site_title if preferences else 'DC Gaming' }}{% endblock %}</title>

    <!-- Open Graph / social previews -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ self.title() }}">
    <meta property="og:description" content="{{ self.description() }}">
    <meta property="og:image" content="{{ url_for('static', filename='images/hero.png', _external=True) }}">
    <meta name="twitter:card" content="summary">

    <link rel="icon" href="{{ url_for('static', filename='images/logo-gold.png') }}">

    <!-- Fonts: preconnect so the display faces don't block first paint -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">

    {% if preferences %}
    <style>
        :root {
            --bg:     {{ preferences.background_color or '#15110C' }};
            --accent: {{ preferences.accent_color or '#F5B921' }};
            --text:   {{ preferences.text_color or '#F7F1E4' }};
        }
    </style>
    {% endif %}
    {% block extra_css %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    <a class="skip-link" href="#main">Skip to content</a>

    {# Faded Kong artwork behind the header on every page. Purely atmospheric,
       so it is a background image on an empty div rather than an <img>. #}
    <div class="page-art" aria-hidden="true"></div>

    <div class="page">
        {% block content %}{% endblock %}
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
